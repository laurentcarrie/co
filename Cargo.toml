[package]
name = "visu-course-co"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
csv = "1.4.0"
eframe = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff"] }
lopdf = "0.47.0"
rfd = "0.18.0"
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
sha2 = "0.11.1"
ureq = { version = "3.5.2", features = ["platform-verifier"] }
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }
